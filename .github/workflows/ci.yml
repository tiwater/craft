name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python tools/check_arch.py
      - run: python -m pytest
      - run: trax demo --task coffee --lost-receipt
      - run: trax demo --task bagel --lost-receipt
      - run: trax demo --task combo --lost-receipt
      - run: python -m build
