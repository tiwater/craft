# ROS 2 Humble <-> Gazebo Fortress topic bridge for CRAFT Café Workstation
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /craft/poses
  gz_topic_name: /world/craft_cafe/dynamic_pose/info
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: ignition.msgs.Pose_V
  direction: GZ_TO_ROS
- ros_topic_name: /craft/camera/overview/image_raw
  gz_topic_name: /craft/camera/overview/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
