[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiwater-craft"
version = "0.1.0"
description = "CRAFT: Code-based Robotic Automation for Fast-Food Tasks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Tiwater"}]
keywords = ["robotics", "code-as-policies", "fast-food", "skill-reuse", "recovery"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
mujoco = ["mujoco>=3.1,<3.4", "numpy>=1.24,<2.3", "Pillow>=10.0"]
robosuite = ["mujoco>=3.1,<3.4", "numpy>=1.24,<2.3", "Pillow>=10.0", "scipy>=1.11", "robosuite>=1.4"]

[project.scripts]
craft = "craft.cli:main"

[project.urls]
Repository = "https://github.com/tiwater/craft"
Documentation = "https://github.com/tiwater/craft/tree/main/docs"
Issues = "https://github.com/tiwater/craft/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
craft = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
